name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Build without and with each feature
        run: |
          cargo build -p doctor-kit
          cargo build -p doctor-kit --features repl
          cargo build -p doctor-kit --features tui
          cargo build -p example-doctor --no-default-features
          cargo build -p example-doctor --all-features
