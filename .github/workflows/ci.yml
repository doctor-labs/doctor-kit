name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p doctor-kit --no-default-features
      - run: cargo test -p doctor-kit
      - name: Build without and with each feature
        run: |
          cargo build -p doctor-kit
          cargo build -p doctor-kit --features repl
          cargo build -p doctor-kit --features tui
          cargo build -p doctor-kit --features mcp
          cargo build -p doctor-kit --features signals
          cargo build -p example-doctor --no-default-features --features mcp
          cargo build -p example-doctor --no-default-features
          cargo build -p example-doctor --all-features
          cargo build -p ext-doctor --no-default-features
          cargo build -p ext-doctor --all-features
  # Compatibility test for current users: a project generated from doctor-template (which pins
  # doctor-kit 0.1) must keep building and passing. While this checkout is 0.1.x the patch applies;
  # from 0.2.0 on Cargo ignores it and the job proves the published 0.1 line still builds.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: doctor-labs/doctor-template
          path: tpl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gen
      - name: Instantiate the template against this kit
        run: |
          # gen/ may already exist (rust-cache restores gen/target), so copy the contents in
          mkdir -p gen
          cp -r tpl/template/. gen/
          rm -f gen/cargo-generate.toml gen/pre.rhai
          grep -rl --exclude-dir=target '{{' gen | xargs sed -i \
            -e 's/{{project-name}}/tpl-doctor/g' -e 's/{{bin_name}}/tpl-doctor/g' \
            -e 's/{{description}}/template check/g' -e 's/{{domain}}/files/g' \
            -e 's/{{author}}/ci <ci@example.com>/g'
          printf '\n[patch.crates-io]\ndoctor-kit = { path = "../kit/doctor-kit" }\n' >> gen/Cargo.toml
      - run: cargo test --manifest-path gen/Cargo.toml
