[package]
name = "doctor-kit"
version = "0.2.4"
edition = "2021"
description = "Reusable runtime for doctor CLI tools: checks, score, faces, themes, REPL, TUI"
license = "MIT"
repository = "https://github.com/doctor-labs/doctor-kit"
readme = "../README.md"
keywords = ["doctor", "cli", "diagnostics", "security", "lint"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE"]

[features]
default = ["repl", "tui", "mcp", "signals"]
repl = ["dep:reedline"]
tui = ["dep:ratatui"]
mcp = []
signals = ["dep:libc"]

[dependencies]
doctor-core = "0.1"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "string"] }
reedline = { version = "0.40", optional = true }
ratatui = { version = "0.30", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
